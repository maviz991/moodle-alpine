# ==============================================================================
# Docker Compose - Moodle com MySQL Externo
# ==============================================================================
# 
# USO:
#   1. Copie .env.example para .env e configure as variáveis
#   2. docker-compose up -d
#
# NOTA: O MySQL está definido aqui apenas para demonstração.
#       Em produção, use um servidor MySQL externo gerenciado.
# ==============================================================================

services:
  # ============================================================================
  # MOODLE (PHP-FPM)
  # ============================================================================
  moodle:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MOODLE_VERSION: "405"
        PHP_VERSION: "8.2"
    image: moodle-secure:4.5
    container_name: moodle-app
    restart: unless-stopped
    
    # Variáveis de ambiente (use .env em produção!)
    environment:
      # Banco de Dados (OBRIGATÓRIOS)
      MOODLE_DB_TYPE: "mysqli"
      MOODLE_DB_HOST: "mysql"           # Altere para seu servidor MySQL externo
      MOODLE_DB_PORT: "3306"
      MOODLE_DB_NAME: "${MOODLE_DB_NAME:-moodle}"
      MOODLE_DB_USER: "${MOODLE_DB_USER:-moodle}"
      MOODLE_DB_PASSWORD: "${MOODLE_DB_PASSWORD}"
      MOODLE_DB_PREFIX: "mdl_"
      
      # Moodle
      MOODLE_WWWROOT: "${MOODLE_WWWROOT:-https://moodle.example.com}"
      MOODLE_DATA_DIR: "/var/moodledata"
      MOODLE_PASSWORD_SALT: "${MOODLE_PASSWORD_SALT}"
      
      # Configurações
      MOODLE_SSL_PROXY: "true"          # Se atrás de reverse proxy com SSL
      MOODLE_DEBUG: "false"
      MOODLE_SKIP_INSTALL: "false"
      
      # Timezone
      TZ: "America/Sao_Paulo"
    
    # Volumes
    volumes:
      # Arquivos do Moodle (compartilhado com nginx)
      - moodle-www:/var/www/html

      # Dados persistentes do Moodle
      - moodledata:/var/moodledata

      # Logs do PHP (opcional, para debug)
      - ./logs/php:/var/log/php

      # Configuração customizada (opcional)
      # - ./config/custom-config.php:/var/www/html/config.php:ro
    
    # Rede
    networks:
      - moodle-network
    
    # Dependências
    depends_on:
      mysql:
        condition: service_healthy
    
    # Recursos (ajuste conforme necessidade)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Segurança
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=256M,mode=1777

  # ============================================================================
  # NGINX (Reverse Proxy / Web Server)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: moodle-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      # Configuração do nginx
      - ./nginx/moodle.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      
      # Arquivos estáticos do Moodle (somente leitura)
      - moodle-www:/var/www/html:ro
      
      # Certificados SSL (gere com Let's Encrypt ou use seus próprios)
      # - ./certs:/etc/nginx/certs:ro
      
      # Logs
      - ./logs/nginx:/var/log/nginx
    
    networks:
      - moodle-network
    
    depends_on:
      - moodle
    
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # MYSQL (APENAS PARA DESENVOLVIMENTO/TESTE)
  # Em produção, use um servidor MySQL externo gerenciado!
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: moodle-mysql
    restart: unless-stopped
    
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MOODLE_DB_NAME:-moodle}"
      MYSQL_USER: "${MOODLE_DB_USER:-moodle}"
      MYSQL_PASSWORD: "${MOODLE_DB_PASSWORD}"
    
    # Configuração otimizada para Moodle
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_file_per_table=1
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=128M
      --max_allowed_packet=128M
      --skip-log-bin
    
    volumes:
      - mysql-data:/var/lib/mysql
      # Script de inicialização (opcional)
      # - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    networks:
      - moodle-network
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Segurança
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # REDIS (Cache de Sessão - Recomendado)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: moodle-redis
    restart: unless-stopped
    
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    
    volumes:
      - redis-data:/data
    
    networks:
      - moodle-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    # Segurança
    security_opt:
      - no-new-privileges:true

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  moodledata:
    driver: local
  moodle-www:
    driver: local
  mysql-data:
    driver: local
  redis-data:
    driver: local

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  moodle-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
