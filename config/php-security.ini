; ==============================================================================
; PHP Security Configuration for Moodle
; Arquivo: php-security.ini
; ==============================================================================

; ------------------------------------------------------------------------------
; EXPOSIÇÃO DE INFORMAÇÕES
; ------------------------------------------------------------------------------
; Desabilita exposição de versão do PHP nos headers HTTP
expose_php = Off

; Desabilita exibição de erros em produção (logs apenas)
display_errors = Off
display_startup_errors = Off

; Log de erros habilitado
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ------------------------------------------------------------------------------
; LIMITES DE RECURSOS (Proteção DoS)
; ------------------------------------------------------------------------------
; Tempo máximo de execução de scripts (em segundos)
max_execution_time = 300

; Tempo máximo para parsing de input
max_input_time = 120

; Limite de memória por script
memory_limit = 512M

; Limite de variáveis de input (proteção contra hash collision)
max_input_vars = 5000

; Limite de tamanho de POST
post_max_size = 128M

; Limite de upload de arquivos
upload_max_filesize = 100M
max_file_uploads = 20

; ------------------------------------------------------------------------------
; PROTEÇÃO DE SESSÕES
; ------------------------------------------------------------------------------
; Usa apenas cookies para sessões (desabilita URL session IDs)
session.use_only_cookies = 1
session.use_strict_mode = 1

; Cookies de sessão HTTPOnly e Secure
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"

; Regenera ID de sessão frequentemente
session.use_trans_sid = 0

; Hash forte para session ID
session.sid_length = 48
session.sid_bits_per_character = 6

; Entropia para geração de session ID
session.entropy_length = 32

; Tempo de vida do cookie de sessão (0 = até fechar navegador)
session.cookie_lifetime = 0

; Garbage collection
session.gc_maxlifetime = 14400
session.gc_probability = 1
session.gc_divisor = 100

; ------------------------------------------------------------------------------
; FUNÇÕES PERIGOSAS DESABILITADAS
; ------------------------------------------------------------------------------
; Lista de funções que podem ser usadas para execução de código malicioso
; ATENÇÃO: Algumas podem ser necessárias para plugins específicos
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,pcntl_exec

; ------------------------------------------------------------------------------
; OPEN BASEDIR - RESTRIÇÃO DE ACESSO A ARQUIVOS
; ------------------------------------------------------------------------------
; Restringe acesso PHP apenas aos diretórios necessários
; Descomente e ajuste conforme sua estrutura
; open_basedir = /var/www/html:/var/moodledata:/tmp

; ------------------------------------------------------------------------------
; OUTRAS CONFIGURAÇÕES DE SEGURANÇA
; ------------------------------------------------------------------------------
; Desabilita inclusão remota de arquivos
allow_url_fopen = On
allow_url_include = Off

; Desabilita register_globals (deprecated, mas para garantia)
; register_globals = Off

; Habilita safe mode para operações de arquivo
; (cuidado: pode quebrar funcionalidades)
; safe_mode = Off

; Desabilita output buffering implícito
output_buffering = 4096

; Define charset padrão
default_charset = "UTF-8"

; Timezone
date.timezone = America/Sao_Paulo

; Desabilita short open tags
short_open_tag = Off

; Assertion - desabilitado em produção
zend.assertions = -1
assert.active = 0
