; ==============================================================================
; PHP Development Configuration
; Apenas para uso em DESENVOLVIMENTO - NÃO use em produção!
; ==============================================================================

; --- Error Reporting (máximo em dev) ---
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php/php-error.log

; --- Limites (generosos para debug) ---
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 128M
upload_max_filesize = 128M
max_input_vars = 5000

; --- Sessões ---
session.cookie_httponly = 1
session.use_strict_mode = 1
; Sem secure flag em dev (sem HTTPS)
session.cookie_secure = 0

; --- OPcache desabilitado em dev (facilita reload de código) ---
opcache.enable = 0
opcache.enable_cli = 0

; --- Timezone ---
date.timezone = America/Sao_Paulo

; --- Xdebug (habilitado se instalado) ---
; xdebug.mode = debug
; xdebug.start_with_request = yes
; xdebug.client_host = host.docker.internal
; xdebug.client_port = 9003
