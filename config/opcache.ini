; ==============================================================================
; OPcache Configuration for Moodle
; Arquivo: opcache.ini
; ==============================================================================

; Habilita OPcache
opcache.enable = 1
opcache.enable_cli = 0

; ------------------------------------------------------------------------------
; MEMÓRIA E ARMAZENAMENTO
; ------------------------------------------------------------------------------
; Tamanho da memória compartilhada (em MB)
; Moodle é grande, 256MB é recomendado
opcache.memory_consumption = 256

; Tamanho máximo para strings internadas
opcache.interned_strings_buffer = 32

; Número máximo de arquivos em cache
; Moodle tem muitos arquivos PHP, 20000+ é seguro
opcache.max_accelerated_files = 30000

; ------------------------------------------------------------------------------
; VALIDAÇÃO E REVALIDAÇÃO
; ------------------------------------------------------------------------------
; Em PRODUÇÃO: desabilite para máxima performance
; Em DESENVOLVIMENTO: habilite para ver mudanças
opcache.validate_timestamps = 0

; Frequência de verificação (em segundos) - só usado se validate_timestamps=1
opcache.revalidate_freq = 60

; Desabilita validação de path (performance)
opcache.revalidate_path = 0

; ------------------------------------------------------------------------------
; OTIMIZAÇÕES
; ------------------------------------------------------------------------------
; Usa memória huge pages se disponível (melhora TLB)
opcache.huge_code_pages = 1

; Nível de otimização (0x7FFEBFFF = máximo)
opcache.optimization_level = 0x7FFEBFFF

; Habilita otimizações de arquivo
opcache.file_update_protection = 2
opcache.file_cache_only = 0

; Cache em disco como fallback (útil para restarts)
; opcache.file_cache = /tmp/opcache

; ------------------------------------------------------------------------------
; PRELOADING (PHP 8.0+)
; ------------------------------------------------------------------------------
; Pode pré-carregar arquivos do Moodle no startup
; Requer script de preload específico
; opcache.preload = /var/www/html/preload.php
; opcache.preload_user = moodle

; ------------------------------------------------------------------------------
; JIT (PHP 8.0+)
; ------------------------------------------------------------------------------
; JIT pode melhorar performance em operações CPU-intensive
; Teste antes de habilitar em produção
; Valores: disable, off, on, tracing, function
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; ------------------------------------------------------------------------------
; CONFIGURAÇÕES DE SEGURANÇA
; ------------------------------------------------------------------------------
; Bloqueia arquivos com erros de compilação
opcache.error_log = /var/log/php/opcache.log
opcache.log_verbosity_level = 2

; Não permite sobrescrever classes/funções
opcache.dups_fix = 0

; Proteção contra mudanças de arquivo
opcache.protect_memory = 0

; ------------------------------------------------------------------------------
; RESTRIÇÕES
; ------------------------------------------------------------------------------
; Lista de arquivos/diretórios a ignorar
; opcache.blacklist_filename = /etc/php/opcache-blacklist.txt

; Limite de memória desperdiçada antes de restart
opcache.max_wasted_percentage = 5

; Força restart quando memória está cheia
opcache.force_restart_timeout = 180

; ------------------------------------------------------------------------------
; ESTATÍSTICAS (desabilite em produção para performance)
; ------------------------------------------------------------------------------
; Habilita acesso às estatísticas via opcache_get_status()
opcache.enable_file_override = 1

; Salva comentários (necessário para alguns frameworks/annotations)
; Moodle usa isso em alguns casos
opcache.save_comments = 1
