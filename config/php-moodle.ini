; ==============================================================================
; PHP Configuration Optimized for Moodle
; Arquivo: php-moodle.ini
; ==============================================================================

; ------------------------------------------------------------------------------
; LIMITES PARA MOODLE
; ------------------------------------------------------------------------------
; Moodle requer estes limites para funcionar adequadamente

; Memória - Moodle recomenda 256M mínimo, 512M para sites grandes
memory_limit = 512M

; Tempo de execução - necessário para backups, upgrades, cron
max_execution_time = 300

; Input vars - necessário para formulários grandes (questionários)
max_input_vars = 5000

; Upload - ajuste conforme necessidade do seu ambiente
post_max_size = 128M
upload_max_filesize = 100M
max_file_uploads = 50

; ------------------------------------------------------------------------------
; EXTENSÕES OBRIGATÓRIAS VERIFICADAS
; ------------------------------------------------------------------------------
; As extensões abaixo são requeridas pelo Moodle:
; - mysqli (ou pgsql para PostgreSQL)
; - gd
; - intl
; - xmlrpc (deprecated mas ainda usado)
; - soap
; - zip
; - opcache (recomendado para performance)

; ------------------------------------------------------------------------------
; CONFIGURAÇÕES DE INTL (INTERNACIONALIZAÇÃO)
; ------------------------------------------------------------------------------
intl.default_locale = pt_BR
intl.error_level = E_WARNING

; ------------------------------------------------------------------------------
; CONFIGURAÇÕES DE MBSTRING
; ------------------------------------------------------------------------------
mbstring.language = Neutral
mbstring.internal_encoding = UTF-8
mbstring.http_input = auto
mbstring.http_output = UTF-8
mbstring.encoding_translation = Off
mbstring.detect_order = auto
mbstring.substitute_character = none

; ------------------------------------------------------------------------------
; CONFIGURAÇÕES DE SESSION PARA MOODLE
; ------------------------------------------------------------------------------
; Moodle pode gerenciar suas próprias sessões via banco/redis/memcached
; Estas são as configurações fallback

session.save_handler = files
session.save_path = /var/moodledata/sessions

; Cookie name - Moodle sobrescreve isso
session.name = MoodleSession

; ------------------------------------------------------------------------------
; CONFIGURAÇÕES DE REALPATH CACHE
; ------------------------------------------------------------------------------
; Melhora performance de include/require
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ------------------------------------------------------------------------------
; CONFIGURAÇÕES DE OUTPUT
; ------------------------------------------------------------------------------
output_buffering = 4096
implicit_flush = Off

; Compressão zlib (use nginx/apache para compressão em produção)
zlib.output_compression = Off

; ------------------------------------------------------------------------------
; CONFIGURAÇÕES DE CTYPE E FILTER
; ------------------------------------------------------------------------------
; Necessário para validações do Moodle
; Extensões ctype e filter são built-in no PHP 8.x
