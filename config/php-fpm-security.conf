; ==============================================================================
; PHP-FPM Security Configuration for Moodle
; Arquivo: php-fpm-security.conf
; ==============================================================================

[www]

; ------------------------------------------------------------------------------
; USUÁRIO E GRUPO
; ------------------------------------------------------------------------------
; Executa como usuário não-privilegiado
user = moodle
group = moodle

; ------------------------------------------------------------------------------
; ESCUTA
; ------------------------------------------------------------------------------
; Escuta em socket TCP (para comunicação com nginx/apache)
listen = 0.0.0.0:9000

; Permissões do socket (se usar unix socket)
; listen = /var/run/php-fpm.sock
; listen.owner = moodle
; listen.group = moodle
; listen.mode = 0660

; IPs permitidos para conexão
; Note: Commenting out allows all connections. Docker network isolation provides security.
; listen.allowed_clients = 127.0.0.1

; Backlog de conexões
listen.backlog = 65535

; ------------------------------------------------------------------------------
; GERENCIAMENTO DE PROCESSOS
; ------------------------------------------------------------------------------
; Modo de gerenciamento: static, dynamic, ondemand
; dynamic é recomendado para a maioria dos casos
pm = dynamic

; Número máximo de processos filhos
pm.max_children = 50

; Processos iniciais (apenas para pm = dynamic)
pm.start_servers = 10

; Mínimo de processos ociosos
pm.min_spare_servers = 5

; Máximo de processos ociosos
pm.max_spare_servers = 20

; Número de requisições antes de reciclar processo (proteção memory leak)
pm.max_requests = 500

; Timeout para processos idle (ondemand apenas)
pm.process_idle_timeout = 10s

; ------------------------------------------------------------------------------
; STATUS E PING (para monitoramento)
; ------------------------------------------------------------------------------
; ATENÇÃO: Proteja estes endpoints via nginx/apache
pm.status_path = /php-fpm-status
ping.path = /php-fpm-ping
ping.response = pong

; ------------------------------------------------------------------------------
; TIMEOUTS E LIMITES
; ------------------------------------------------------------------------------
; Tempo máximo de execução de requisição (proteção DoS)
request_terminate_timeout = 300s

; Tempo de slowlog (requisições lentas)
request_slowlog_timeout = 30s
slowlog = /var/log/php/slow.log

; ------------------------------------------------------------------------------
; LOGS
; ------------------------------------------------------------------------------
; Habilita captura de stderr de workers
catch_workers_output = yes
decorate_workers_output = no

; Log de acesso
access.log = /var/log/php/access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Logs de erro já configurados no php.ini principal
; php_admin_value[error_log] = /var/log/php/error.log

; ------------------------------------------------------------------------------
; SEGURANÇA - VALORES ADMIN (não podem ser sobrescritos)
; ------------------------------------------------------------------------------
; Desabilita funções perigosas (complemento ao php.ini)
; php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen

; Open basedir (restringe acesso a arquivos)
php_admin_value[open_basedir] = /var/www/html:/var/moodledata:/tmp:/usr/share/zoneinfo

; Desabilita inclusão de URLs remotas
php_admin_flag[allow_url_include] = Off

; Esconde versão do PHP
php_admin_flag[expose_php] = Off

; ------------------------------------------------------------------------------
; VARIÁVEIS DE AMBIENTE
; ------------------------------------------------------------------------------
; Limpa variáveis de ambiente (segurança)
clear_env = yes

; Variáveis de ambiente permitidas
; env[HOSTNAME] = $HOSTNAME
; env[PATH] = /usr/local/bin:/usr/bin:/bin
; env[TMP] = /tmp
; env[TMPDIR] = /tmp
; env[TEMP] = /tmp

; ------------------------------------------------------------------------------
; CHROOT (opcional - máxima segurança)
; ------------------------------------------------------------------------------
; Requer configuração adicional de diretórios
; chroot = /var/www
; chdir = /html

; ------------------------------------------------------------------------------
; LIMITES DE RECURSOS
; ------------------------------------------------------------------------------
; Limite de arquivos abertos
rlimit_files = 65535

; Limite de memória core dump (0 = desabilitado)
rlimit_core = 0

; ------------------------------------------------------------------------------
; SEGURANÇA ADICIONAL
; ------------------------------------------------------------------------------
; Proteção contra ataques de path traversal
; security.limit_extensions = .php

; Corrige pathinfo (importante para URLs amigáveis)
; cgi.fix_pathinfo = 0
