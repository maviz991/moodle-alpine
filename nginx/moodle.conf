# ==============================================================================
# Nginx Configuration for Moodle
# Arquivo: nginx/moodle.conf
# ==============================================================================

# Upstream para PHP-FPM
upstream php-fpm {
    server moodle:9000;
    keepalive 32;
}

# Redireciona HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name moodle.example.com;  # Altere para seu domínio
    
    # Permite apenas ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redireciona todo o resto para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moodle.example.com;  # Altere para seu domínio
    
    # ===========================================================================
    # RAIZ E INDEX
    # ===========================================================================
    root /var/www/html;
    index index.php index.html;
    
    # ===========================================================================
    # SSL/TLS CONFIGURATION
    # ===========================================================================
    # Certificados (ajuste os caminhos)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    # Protocolos e cifras (configuração moderna)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Session tickets e cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # DH Parameters (gere com: openssl dhparam -out dhparam.pem 4096)
    # ssl_dhparam /etc/nginx/certs/dhparam.pem;
    
    # ===========================================================================
    # SECURITY HEADERS
    # ===========================================================================
    include /etc/nginx/snippets/security-headers.conf;
    
    # ===========================================================================
    # LOGS
    # ===========================================================================
    access_log /var/log/nginx/moodle_access.log combined buffer=16k;
    error_log /var/log/nginx/moodle_error.log warn;
    
    # ===========================================================================
    # LIMITES E TIMEOUTS
    # ===========================================================================
    client_max_body_size 128M;
    client_body_timeout 120s;
    client_header_timeout 60s;
    keepalive_timeout 65;
    send_timeout 120s;
    
    # Buffer sizes
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # ===========================================================================
    # RATE LIMITING (proteção contra brute force)
    # ===========================================================================
    # Definido no nginx.conf principal:
    # limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    # limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    
    # ===========================================================================
    # GZIP COMPRESSION
    # ===========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    
    # ===========================================================================
    # LOCATIONS
    # ===========================================================================
    
    # Página principal
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP handler
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        
        # Verifica se arquivo existe (segurança)
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        
        # FastCGI params
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        
        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        
        # Buffers
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        # Keepalive
        fastcgi_keep_conn on;
    }
    
    # Dataroot protection (CRÍTICO!)
    location /moodledata {
        internal;
    }
    
    # Bloqueia acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        return 404;
    }
    
    location ~* /(config\.php|readme|version|install|upgrade)\.txt$ {
        deny all;
        return 404;
    }
    
    location ~ /vendor/ {
        deny all;
        return 404;
    }
    
    # Proteção para área de login (rate limiting)
    location ~ ^/login/ {
        # limit_req zone=login burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Cache para arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        
        # Permite CORS para fontes
        location ~* \.(woff|woff2|ttf|eot)$ {
            add_header Access-Control-Allow-Origin "*";
        }
    }
    
    # Pluginfile.php (arquivos do Moodle)
    location ~ ^/pluginfile\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        
        # Cache de arquivos servidos pelo pluginfile
        fastcgi_cache_valid 200 60m;
    }
    
    # Tokenpluginfile.php (arquivos com token)
    location ~ ^/tokenpluginfile\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
    }
    
    # Web services
    location ~ ^/webservice/ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # H5P
    location ~ ^/h5p/ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Bloqueia acesso ao admin se necessário (opcional)
    # Descomente e ajuste os IPs permitidos
    # location ~ ^/admin/ {
    #     allow 192.168.1.0/24;
    #     allow 10.0.0.0/8;
    #     deny all;
    #     try_files $uri $uri/ /index.php?$query_string;
    # }
    
    # PHP-FPM status (apenas para monitoramento interno)
    location ~ ^/(php-fpm-status|php-fpm-ping)$ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
