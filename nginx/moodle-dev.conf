# ==============================================================================
# Nginx Configuration for Moodle - DESENVOLVIMENTO
# Sem SSL, sem HTTPS, acesso direto na porta 80 (mapeada para 8080 no host)
# ==============================================================================

upstream php-fpm {
    server moodle:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    root /var/www/html;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/moodle_access.log combined;
    error_log /var/log/nginx/moodle_error.log debug;

    # Limites
    client_max_body_size 128M;
    client_body_timeout 120s;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Página principal
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handler (sem HTTPS param - é dev sem SSL)
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)?$;

        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }

        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Em dev, não forçamos HTTPS
        fastcgi_param HTTPS off;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }

    # Pluginfile
    location ~ ^/pluginfile\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)?$;
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS off;
    }

    # Proteção básica
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ /vendor/ {
        deny all;
        return 404;
    }

    # Status PHP-FPM (dev - libera localhost e rede interna)
    location ~ ^/(php-fpm-status|php-fpm-ping)$ {
        allow 127.0.0.1;
        allow 172.0.0.0/8;
        deny all;
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
