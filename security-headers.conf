# ==============================================================================
# Security Headers for Nginx
# Arquivo: nginx/security-headers.conf
# ==============================================================================

# HSTS (HTTP Strict Transport Security)
# Força conexões HTTPS por 1 ano, inclui subdomínios
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Previne clickjacking
# SAMEORIGIN permite iframe do mesmo domínio (necessário para Moodle)
add_header X-Frame-Options "SAMEORIGIN" always;

# Previne MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# XSS Protection (navegadores modernos)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
# strict-origin-when-cross-origin é um bom equilíbrio
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (antigo Feature-Policy)
# Restringe APIs do navegador
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Content Security Policy (CSP)
# ATENÇÃO: CSP do Moodle é complexo devido aos plugins
# Esta é uma política básica - ajuste conforme necessidade
# 
# Moodle precisa de:
# - 'unsafe-inline' e 'unsafe-eval' para scripts (infelizmente)
# - Data URIs para imagens
# - Blob para alguns recursos
# - Conexões para APIs externas (YouTube, Vimeo, etc)
#
# Em produção, monitore violações e ajuste conforme necessário

add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com https://player.vimeo.com https://www.googletagmanager.com https://www.google-analytics.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    img-src 'self' data: blob: https: http:;
    font-src 'self' data: https://fonts.gstatic.com;
    frame-src 'self' https://www.youtube.com https://player.vimeo.com https://www.youtube-nocookie.com;
    frame-ancestors 'self';
    connect-src 'self' https: wss:;
    media-src 'self' https: blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
" always;

# Cache Control para conteúdo dinâmico
# Arquivos PHP não devem ser cacheados pelo navegador
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
